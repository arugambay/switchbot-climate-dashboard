# Farben und Formen entsprechen den Tokens in climate_dashboard/ui/theme.py (COLORS, RADIUS).
[theme]
base = "light"
# Tiefschwarz für Bedienelemente (Checkboxen, Schalter, Fortschritt); Markenblau für Links und Logo.
primaryColor = "#111318"
backgroundColor = "#F2F3F5"
# Weiß: Streamlit nutzt diesen Wert u. a. für Eingabefelder und als Diagrammhintergrund.
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111318"
linkColor = "#2563EB"
font = "Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Times New Roman', serif"
headingFontWeights = [500, 500, 600, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "12px"
borderColor = "#E6E8EC"
showWidgetBorder = true
dataframeBorderColor = "#E6E8EC"
dataframeHeaderBackgroundColor = "#F7F8FA"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
borderColor = "#E6E8EC"

[client]
toolbarMode = "minimal"
# Keine Tracebacks im Browser (öffentliche Berichtsseite!). Fehler stehen im Server-Log.
showErrorDetails = "none"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 200
